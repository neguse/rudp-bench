name: v2

on:
  push:
    branches: [master]
  pull_request:

jobs:
  calibration-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init third_party/enet third_party/kcp

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: orchestrator vet + test
        run: |
          go vet ./orchestrator/...
          go test -count=1 ./orchestrator/...
          go build -o build-v2/orchestrator ./orchestrator/cmd/orchestrator

      # 校正スイート(会計零点・既知故障注入を含む。sudo/netns 不要)
      - name: benchkit build + calibration tests
        run: |
          cmake -S benchkit -B build-v2-benchkit
          cmake --build build-v2-benchkit -j
          ctest --test-dir build-v2-benchkit --output-on-failure
          dotnet run -c Release --project servers/dotnet/BenchKit.CS.Tests/BenchKit.CS.Tests.csproj

      - name: build SUTs
        run: |
          for t in raw_udp enet kcp; do
            cmake -S servers/$t -B build-v2-$t -DCMAKE_BUILD_TYPE=Release
            cmake --build build-v2-$t -j
          done
          for p in litenetlib/LiteNetLibBench websocket/WebSocketBench magiconion/MagicOnionBench; do
            dotnet publish -c Release -o build-v2-dotnet/${p#*/} servers/$p.csproj
          done

      - name: loopback run
        run: |
          scripts/badnet/gen.py --loopback --out build-v2-loopback \
            --transports raw_udp,enet,kcp,litenetlib,websocket,magiconion
          for c in build-v2-loopback/configs/*.json; do
            build-v2/orchestrator run -config "$c" || { echo "FAIL: $c"; exit 1; }
          done

      - name: calibration duration invariance
        run: ./calibration/duration_invariance.sh

  native-solution-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: gns
            transports: gns
          - adapter: msquic
            transports: msquic,msquic-cancel-on-blocked
          - adapter: yojimbo
            transports: yojimbo
          - adapter: quiche
            transports: quiche
          - adapter: lsquic
            transports: lsquic
            extra_submodules: third_party/boringssl

    steps:
      - uses: actions/checkout@v4

      - name: Init adapter submodule
        run: git submodule update --init --recursive third_party/${{ matrix.adapter }} ${{ matrix.extra_submodules }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libnuma-dev libprotobuf-dev libssl-dev libsodium-dev protobuf-compiler zlib1g-dev

      - name: build + loopback run
        run: |
          go build -o build-v2/orchestrator ./orchestrator/cmd/orchestrator
          cmake -S servers/${{ matrix.adapter }} -B build-v2-${{ matrix.adapter }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build-v2-${{ matrix.adapter }} -j2
          scripts/badnet/gen.py --loopback --out build-v2-loopback --transports ${{ matrix.transports }}
          for c in build-v2-loopback/configs/*.json; do
            build-v2/orchestrator run -config "$c" || { echo "FAIL: $c"; exit 1; }
          done
