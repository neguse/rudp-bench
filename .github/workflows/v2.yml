name: v2

on:
  push:
    branches: [master]
  pull_request:

jobs:
  calibration-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init third_party/enet third_party/kcp

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: orchestrator vet + test
        run: |
          go vet ./orchestrator/...
          go test -count=1 ./orchestrator/...
          go build -o build-v2/orchestrator ./orchestrator/cmd/orchestrator

      # 校正スイート(会計零点・既知故障注入を含む。sudo/netns 不要)
      - name: benchkit build + calibration tests
        run: |
          cmake -S benchkit -B build-v2-benchkit
          cmake --build build-v2-benchkit -j
          ctest --test-dir build-v2-benchkit --output-on-failure
          dotnet run -c Release --project servers/dotnet/BenchKit.CS.Tests/BenchKit.CS.Tests.csproj

      - name: build SUTs
        run: |
          for t in raw_udp enet kcp coop_rudp; do
            cmake -S servers/$t -B build-v2-$t -DCMAKE_BUILD_TYPE=Release
            cmake --build build-v2-$t -j
          done
          ctest --test-dir build-v2-coop_rudp --output-on-failure
          for p in litenetlib/LiteNetLibBench litenetlib/timeout30/LiteNetLibBenchTimeout30 websocket/WebSocketBench magiconion/MagicOnionBench; do
            dotnet publish -c Release -o build-v2-dotnet/${p##*/} servers/$p.csproj
          done

      - name: loopback run
        run: |
          scripts/badnet/gen.py --loopback --out build-v2-loopback \
            --transports raw_udp,enet,enet-timeout30,kcp,coop_rudp,litenetlib,litenetlib-timeout30,websocket,magiconion
          fails=0
          for i in $(seq 1 6); do
            for c in build-v2-loopback/configs/*.json; do
              python3 -c 'import json, sys; c = json.load(open(sys.argv[1])); c["output_dir"] += "-" + sys.argv[2]; json.dump(c, open("/tmp/c.json", "w"))' "$c" "$i"
              d=$(python3 -c 'import json; print(json.load(open("/tmp/c.json"))["output_dir"])')
              if ! build-v2/orchestrator run -config /tmp/c.json > /dev/null 2>&1; then
                fails=$((fails+1)); echo "FAIL iter=$i $c"; cat "$d/summary.txt"; tail -n 30 "$d"/logs/*.log
              fi
            done
          done
          echo "fails=$fails"

      - name: calibration duration invariance
        run: ./calibration/duration_invariance.sh

