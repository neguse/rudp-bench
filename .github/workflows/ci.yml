name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build iproute2 \
            libsodium-dev libnuma-dev libssl-dev libprotobuf-dev protobuf-compiler

      - name: Test Go packages
        run: go test ./internal/...

      # third_party/kcp は cmake_minimum_required(VERSION 2.6) を宣言しており、CMake 4 は 3.5 未満の互換を受け付けない。
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
